server {
    listen 80;
    server_name _;

    # Serve static files
    location / {
        root /app/public;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Serve video analysis app
    location /video-analysis/ {
        root /app/public;
        try_files $uri $uri/ /video-analysis/index.html;
    }

    # Serve shared modules
    location /shared/ {
        root /app/public;
    }

    # SSE streaming endpoint — disable buffering
    location /api/video/focus-stream {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy API requests to Express server
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
    }

    # Allow large video uploads
    client_max_body_size 100M;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";
}
